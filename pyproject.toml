[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-workspace"
version = "1.0.0"
description = "Business Workspace Portal for ROI Analytics and HITL Approvals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "structlog>=24.2.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.10",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/businessportal"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*"
]
ignore_missing_imports = true
